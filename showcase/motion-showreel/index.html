<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Afterlight — Motion Showreel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-Italic.ttf") format("truetype");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("fonts/InstrumentSans-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0C0B09;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0C0B09;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #scene2, #scene3, #scene4, #scene5, #scene6 { opacity: 0; }

      .serif {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        line-height: 0.86;
        color: #F4EFE6;
      }

      #glow {
        position: absolute;
        width: 880px;
        height: 880px;
        right: -460px;
        top: -420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(232, 201, 154, 0.42) 0%, rgba(232, 201, 154, 0) 70%);
        z-index: 0;
      }
      #shaft {
        position: absolute;
        width: 72px;
        height: 1500px;
        left: 990px;
        top: -220px;
        opacity: 0.55;
        background: linear-gradient(to bottom, rgba(243, 230, 200, 0), rgba(243, 230, 200, 0.42), rgba(243, 230, 200, 0));
        filter: blur(8px);
        z-index: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(12, 11, 9, 0) 52%, rgba(12, 11, 9, 0.5) 100%);
      }
      #rail-top, #rail-bot {
        position: absolute;
        left: 72px;
        width: 1776px;
        height: 2px;
        background: #E8C99A;
        z-index: 11;
        transform-origin: 50% 50%;
      }
      #rail-top { top: 48px; }
      #rail-bot { bottom: 48px; }

      #glass-rig {
        position: absolute;
        right: 128px;
        top: 150px;
        width: 460px;
        height: 660px;
        perspective: 1200px;
        z-index: 3;
      }
      #glass {
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, rgba(244, 239, 230, 0.32), rgba(244, 239, 230, 0.05) 46%, rgba(12, 11, 9, 0.15));
        border: 1px solid rgba(243, 230, 200, 0.7);
        box-shadow: inset 0 1px 0 rgba(244, 239, 230, 0.45);
        transform: rotateY(-22deg) rotateX(8deg);
        transform-style: preserve-3d;
        overflow: hidden;
      }
      #glass-inset {
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(243, 230, 200, 0.32);
      }
      #shine {
        position: absolute;
        width: 38%;
        height: 170%;
        left: -40%;
        top: -30%;
        background: linear-gradient(90deg, rgba(244, 239, 230, 0), rgba(244, 239, 230, 0.55), rgba(244, 239, 230, 0));
      }
      #s1-rule {
        position: absolute;
        left: 112px;
        top: 168px;
        width: 168px;
        height: 2px;
        background: #E8C99A;
        transform-origin: 0% 50%;
      }
      #after {
        position: absolute;
        left: 104px;
        top: 210px;
        font-size: 280px;
      }
      #light {
        position: absolute;
        left: 104px;
        top: 500px;
        font-size: 280px;
        color: #E8C99A;
      }

      #lens {
        position: absolute;
        left: 128px;
        top: 160px;
        width: 500px;
        height: 500px;
      }
      #lens-word {
        position: absolute;
        left: 128px;
        top: 690px;
        width: 500px;
        text-align: center;
        font-size: 148px;
      }
      #edge {
        position: absolute;
        right: 140px;
        top: 280px;
        display: flex;
        font-size: 380px;
      }
      #edge span { display: block; }
      #edge-tick {
        position: absolute;
        right: 140px;
        top: 230px;
        width: 720px;
        height: 8px;
        background: #E24B32;
        transform-origin: 100% 50%;
      }

      #plane-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 6;
        opacity: 0;
      }
      #plane {
        position: absolute;
        left: 0;
        right: 0;
        top: 78px;
        bottom: 78px;
        background: #E7D3A1;
      }
      #seam {
        position: absolute;
        left: 0;
        top: 78px;
        width: 3px;
        bottom: 78px;
        background: #0C0B09;
      }
      #hold-rule {
        position: absolute;
        left: 176px;
        top: 430px;
        width: 132px;
        height: 2px;
        background: #0C0B09;
        transform-origin: 0% 50%;
      }
      #hold {
        position: absolute;
        left: 168px;
        top: 460px;
        font-size: 176px;
        color: #0C0B09;
      }
      #form {
        position: absolute;
        left: 112px;
        top: 340px;
        display: flex;
        perspective: 900px;
        font-size: 300px;
        z-index: 4;
      }
      #form span {
        display: block;
        transform-origin: 50% 100%;
      }

      #cut-rig {
        position: absolute;
        left: 150px;
        top: 210px;
        width: 680px;
        transform: rotate(-8deg);
        transform-origin: 0% 20%;
      }
      #cut {
        font-size: 340px;
      }
      #slash {
        width: 640px;
        height: 10px;
        margin: 28px 0 24px;
        background: #E24B32;
        transform-origin: 0% 50%;
      }
      #frame-word {
        font-size: 200px;
      }

      #pulse-word {
        position: absolute;
        left: 0;
        width: 1920px;
        top: 300px;
        text-align: center;
        font-size: 220px;
      }
      #skyline {
        position: absolute;
        left: 120px;
        width: 1680px;
        bottom: 92px;
        height: 380px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
      }
      .bar {
        flex: 1;
        transform-origin: 50% 100%;
        background: #E8C99A;
      }
      .bar.bone { background: #F4EFE6; }
      .bar.signal { background: #E24B32; }
      #ground {
        position: absolute;
        left: 120px;
        bottom: 88px;
        width: 1680px;
        height: 2px;
        background: #F4EFE6;
        transform-origin: 0% 50%;
      }

      #seal {
        position: absolute;
        left: 820px;
        top: 132px;
        width: 280px;
        height: 280px;
      }
      #lock-copy {
        position: absolute;
        left: 0;
        width: 1920px;
        top: 470px;
        text-align: center;
      }
      #mark { font-size: 188px; }
      #lock-rule {
        width: 168px;
        height: 2px;
        margin: 22px auto 0;
        background: #E8C99A;
        transform-origin: 50% 50%;
      }
      #lock-sub {
        margin-top: 20px;
        font-family: "Instrument Sans", sans-serif;
        font-size: 30px;
        letter-spacing: 0.22em;
        color: #F4EFE6;
      }
      #lock-time {
        margin-top: 16px;
        font-family: "Instrument Sans", sans-serif;
        font-size: 22px;
        letter-spacing: 0.28em;
        color: #E8C99A;
      }

      #streak {
        position: absolute;
        top: -180px;
        left: 0;
        width: 200px;
        height: 1500px;
        background: linear-gradient(90deg, rgba(244, 239, 230, 0), rgba(244, 239, 230, 0.72), rgba(244, 239, 230, 0));
        opacity: 0;
        z-index: 12;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="showreel"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="glow"></div>
      <div id="shaft"></div>
      <div id="vignette"></div>
      <div id="rail-top"></div>
      <div id="rail-bot"></div>

      <div id="scene1" class="scene">
        <div id="glass-rig">
          <div id="glass">
            <div id="shine"></div>
            <div id="glass-inset"></div>
          </div>
        </div>
        <div id="s1-rule"></div>
        <div id="after" class="serif">After</div>
        <div id="light" class="serif">light</div>
      </div>

      <div id="scene2" class="scene">
        <svg id="lens" viewBox="0 0 200 200" fill="none">
          <circle id="lens-ring" cx="100" cy="100" r="86" stroke="#E8C99A" stroke-width="2.5" stroke-dasharray="540" stroke-dashoffset="540" />
          <path id="lens-cut" d="M100 22 V178" stroke="#E24B32" stroke-width="2.5" stroke-dasharray="156" stroke-dashoffset="156" />
        </svg>
        <div id="lens-word" class="serif">Lens</div>
        <div id="edge-tick"></div>
        <div id="edge" class="serif">
          <span>E</span><span>d</span><span>g</span><span>e</span>
        </div>
      </div>

      <div id="scene3" class="scene">
        <div id="form" class="serif">
          <span>F</span><span>o</span><span>r</span><span>m</span>
        </div>
      </div>

      <div id="plane-wrap">
        <div id="plane"></div>
        <div id="seam"></div>
        <div id="hold-rule"></div>
        <div id="hold" class="serif">Hold</div>
      </div>

      <div id="scene4" class="scene">
        <div id="cut-rig">
          <div id="cut" class="serif">Cut</div>
          <div id="slash"></div>
          <div id="frame-word" class="serif">Frame</div>
        </div>
      </div>

      <div id="scene5" class="scene">
        <div id="pulse-word" class="serif">Pulse</div>
        <div id="ground"></div>
        <div id="skyline">
          <div class="bar" style="height: 140px"></div>
          <div class="bar bone" style="height: 240px"></div>
          <div class="bar" style="height: 180px"></div>
          <div class="bar" style="height: 320px"></div>
          <div class="bar bone" style="height: 200px"></div>
          <div class="bar" style="height: 280px"></div>
          <div class="bar" style="height: 160px"></div>
          <div class="bar signal" style="height: 360px"></div>
          <div class="bar" style="height: 220px"></div>
          <div class="bar bone" style="height: 300px"></div>
          <div class="bar" style="height: 190px"></div>
          <div class="bar" style="height: 340px"></div>
          <div class="bar" style="height: 150px"></div>
          <div class="bar bone" style="height: 260px"></div>
        </div>
      </div>

      <div id="scene6" class="scene">
        <svg id="seal" viewBox="0 0 200 200" fill="none">
          <circle id="seal-ring" cx="100" cy="100" r="86" stroke="#E8C99A" stroke-width="2" stroke-dasharray="540" stroke-dashoffset="540" />
          <circle cx="100" cy="100" r="5" fill="#E24B32" />
        </svg>
        <div id="lock-copy">
          <div id="mark" class="serif">Afterlight</div>
          <div id="lock-rule"></div>
          <div id="lock-sub">Motion Design</div>
          <div id="lock-time">00:30</div>
        </div>
      </div>

      <div id="streak"></div>

      <audio
        id="score"
        data-start="0"
        data-duration="30"
        data-track-index="1"
        data-volume="1"
        src="audio/score.wav"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      tl.addLabel("open", 0);
      tl.addLabel("xA", 5.15);
      tl.addLabel("xB", 10.15);
      tl.addLabel("xC", 15.4);
      tl.addLabel("xD", 21.35);
      tl.addLabel("xE", 25.85);
      tl.addLabel("out", 28.35);

      function handoff(outEl, inEl, label) {
        tl.to(outEl, {
          opacity: 0,
          scale: 1.04,
          duration: 0.55,
          ease: "power2.inOut",
          transformOrigin: "50% 50%"
        }, label);
        tl.fromTo(inEl, {
          opacity: 0,
          scale: 0.975
        }, {
          opacity: 1,
          scale: 1,
          duration: 0.55,
          ease: "power2.inOut",
          immediateRender: false,
          transformOrigin: "50% 50%"
        }, label);
      }

      function sweep(label, fromX, toX) {
        tl.fromTo("#streak", {
          x: fromX,
          rotation: 16
        }, {
          x: toX,
          rotation: 16,
          duration: 0.5,
          ease: "power2.inOut",
          immediateRender: false
        }, label);
        tl.fromTo("#streak", {
          opacity: 0
        }, {
          opacity: 0.8,
          duration: 0.14,
          ease: "power1.out",
          immediateRender: false
        }, label);
        tl.to("#streak", {
          opacity: 0,
          duration: 0.18,
          ease: "power1.in"
        }, label + "+=0.26");
      }

      tl.from("#glow", { scale: 0.84, opacity: 0, duration: 1.05, ease: "power2.out" }, "open");
      tl.to("#glow", { x: -36, duration: 7.5, ease: "sine.inOut" }, "open+=1.2");
      tl.from("#shaft", { y: -180, opacity: 0, duration: 0.9, ease: "power3.out" }, "open");
      tl.to("#shaft", { opacity: 0, duration: 0.5, ease: "power1.in" }, "xE-=0.7");
      tl.from("#rail-top", { scaleX: 0, duration: 0.7, ease: "power3.inOut" }, "open+=0.12");
      tl.from("#rail-bot", { scaleX: 0, duration: 0.7, ease: "power3.inOut" }, "open+=0.2");

      tl.from("#glass", {
        rotateY: -70,
        rotateX: 16,
        z: -280,
        opacity: 0,
        duration: 1.15,
        ease: "power4.out",
        transformOrigin: "50% 50%"
      }, "open+=0.08");
      tl.to("#glass", {
        rotateY: -14,
        rotateX: 6,
        duration: 2.3,
        ease: "sine.inOut"
      }, "open+=1.4");
      tl.from("#glass-inset", { opacity: 0, duration: 0.4, ease: "power1.out" }, "open+=0.4");
      tl.fromTo("#shine", { x: -60, rotation: 18 }, {
        x: 420,
        rotation: 18,
        duration: 1.55,
        ease: "power2.inOut"
      }, "open+=0.36");
      tl.from("#s1-rule", { scaleX: 0, duration: 0.5, ease: "power3.inOut" }, "open+=0.2");
      tl.from("#after", { y: 64, opacity: 0, duration: 0.66, ease: "power4.out" }, "open+=0.32");
      tl.from("#light", { y: 58, opacity: 0, duration: 0.6, ease: "power4.out" }, "open+=0.58");

      handoff("#scene1", "#scene2", "xA");
      sweep("xA", -820, 2360);

      tl.fromTo("#lens-ring", { strokeDashoffset: 540 }, {
        strokeDashoffset: 0,
        duration: 0.85,
        ease: "power3.inOut",
        immediateRender: false
      }, "xA+=0.06");
      tl.fromTo("#lens-cut", { strokeDashoffset: 156 }, {
        strokeDashoffset: 0,
        duration: 0.32,
        ease: "power4.out",
        immediateRender: false
      }, "xA+=0.62");
      tl.from("#lens-word", { y: 26, opacity: 0, duration: 0.4, ease: "power3.out" }, "xA+=0.28");
      tl.from("#edge-tick", { scaleX: 0, duration: 0.38, ease: "power3.inOut" }, "xA+=0.08");
      tl.from("#edge span", {
        y: 80,
        opacity: 0,
        duration: 0.4,
        ease: "expo.out",
        stagger: 0.045
      }, "xA+=0.1");

      handoff("#scene2", "#scene3", "xB");
      sweep("xB", 2500, -860);
      tl.fromTo("#plane-wrap", { x: 1860, opacity: 0 }, {
        x: 1280,
        opacity: 1,
        duration: 0.7,
        ease: "power4.out",
        immediateRender: false
      }, "xB");
      tl.from("#form span", {
        rotateX: -78,
        y: 60,
        opacity: 0,
        duration: 0.46,
        ease: "power4.out",
        stagger: 0.05,
        transformOrigin: "50% 100%"
      }, "xB+=0.28");
      tl.from("#seam", { scaleY: 0, duration: 0.45, ease: "power3.out", transformOrigin: "50% 0%" }, "xB+=0.08");
      tl.from("#hold-rule", { scaleX: 0, duration: 0.35, ease: "power3.inOut" }, "xB+=1.0");
      tl.from("#hold", { y: 40, opacity: 0, duration: 0.42, ease: "power3.out" }, "xB+=1.08");

      handoff("#scene3", "#scene4", "xC");
      sweep("xC", -820, 2360);
      tl.to("#plane-wrap", {
        x: 2140,
        opacity: 0,
        duration: 0.55,
        ease: "power3.in"
      }, "xC");
      tl.from("#cut-rig", {
        rotation: -18,
        opacity: 0,
        duration: 0.55,
        ease: "power3.out",
        transformOrigin: "0% 20%"
      }, "xC+=0.06");
      tl.from("#cut", { y: 48, opacity: 0, duration: 0.42, ease: "power4.out" }, "xC+=0.12");
      tl.from("#slash", { scaleX: 0, duration: 0.32, ease: "power4.inOut" }, "xC+=0.28");
      tl.from("#frame-word", { y: 28, opacity: 0, duration: 0.4, ease: "power3.out" }, "xC+=0.42");

      handoff("#scene4", "#scene5", "xD");
      sweep("xD", -820, 2360);
      tl.from("#pulse-word", { y: 36, opacity: 0, duration: 0.42, ease: "power3.out" }, "xD+=0.08");
      tl.from("#ground", { scaleX: 0, duration: 0.4, ease: "power2.out" }, "xD+=0.06");
      tl.from("#skyline .bar", {
        scaleY: 0,
        duration: 0.46,
        ease: "back.out(1.4)",
        stagger: 0.04,
        transformOrigin: "50% 100%"
      }, "xD+=0.12");

      handoff("#scene5", "#scene6", "xE");
      sweep("xE", -820, 2360);
      tl.fromTo("#seal-ring", { strokeDashoffset: 540 }, {
        strokeDashoffset: 0,
        duration: 0.75,
        ease: "power3.inOut",
        immediateRender: false
      }, "xE+=0.08");
      tl.from("#seal", {
        rotation: -24,
        opacity: 0,
        duration: 0.55,
        ease: "power3.out",
        transformOrigin: "50% 50%"
      }, "xE+=0.08");
      tl.to("#seal", { rotation: 16, duration: 1.1, ease: "sine.inOut" }, "xE+=0.8");
      tl.from("#mark", { y: 42, opacity: 0, duration: 0.5, ease: "power4.out" }, "xE+=0.16");
      tl.from("#lock-rule", { scaleX: 0, duration: 0.36, ease: "power3.inOut" }, "xE+=0.42");
      tl.from("#lock-sub", { y: 16, opacity: 0, duration: 0.32, ease: "power2.out" }, "xE+=0.5");
      tl.from("#lock-time", { y: 12, opacity: 0, duration: 0.28, ease: "power2.out" }, "xE+=0.62");

      tl.to("#scene6", { opacity: 0, duration: 1.4, ease: "power2.in" }, "out");
      tl.to("#glow", { opacity: 0, duration: 1.2, ease: "power1.in" }, "out");
      tl.to("#rail-top", { opacity: 0, duration: 1.1, ease: "power1.in" }, "out");
      tl.to("#rail-bot", { opacity: 0, duration: 1.1, ease: "power1.in" }, "out");
      tl.to("#vignette", { opacity: 0, duration: 1.0, ease: "power1.in" }, "out");

      window.__timelines["showreel"] = tl;
    </script>
  </body>
</html>
